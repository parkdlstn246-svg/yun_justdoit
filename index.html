<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤성 · 링크</title>
<meta name="description" content="윤성의 웹사이트와 블로그 링크 모음">
<!-- 링크 미리보기(카톡·인스타 DM 등)에 보이는 정보 -->
<meta property="og:title" content="윤성 · 링크">
<meta property="og:description" content="웹사이트와 블로그를 한 곳에서">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e3f2fd;      /* 배경색: 연한 하늘색 */
    --card: #ffffff;
    --text: #1b2a38;
    --muted: #5f7385;
    --line: #cde4f5;
    --accent: #4a9fe0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 16px 40px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    margin: 0 auto 16px;
    background: var(--accent);
    color: #fff; font-size: 36px; font-weight: 700;
    display: grid; place-items: center;
    object-fit: cover;
  }
  h1 { font-size: 22px; font-weight: 700; }
  .handle {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 14px; margin-top: 6px;
    text-decoration: none;
  }
  .handle .go {
    background: var(--card); color: var(--accent);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; font-size: 12px; font-weight: 500;
  }
  .handle:hover .go, .handle:focus-visible .go { border-color: var(--accent); }
  .bio { font-size: 15px; line-height: 1.6; margin: 14px auto 32px; max-width: 340px; white-space: pre-line; }
  ul { list-style: none; display: grid; gap: 12px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    color: var(--text); text-decoration: none; text-align: left;
    transition: transform .15s ease, border-color .15s ease;
  }
  a.link:hover, a.link:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .emoji { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
  .label { font-weight: 500; font-size: 16px; }
  .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .arrow { margin-left: auto; color: var(--muted); flex-shrink: 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <div id="profile"></div>
  <ul id="links"></ul>
  <footer id="footer"></footer>
</main>

<script>
/* ===========================================
   ✏️ 여기만 고치면 돼요
   =========================================== */
const PROFILE = {
  name: "윤성 | 뭐든",
  handle: "@yun_justdoit",          // 인스타 아이디
  instagram: "https://www.instagram.com/yun_justdoit/",  // 아이디를 누르면 열리는 주소
  bio: "경험과 생각을 콘텐츠로 공유해요 💬\n취준 · 일 • 운동 · 자기관리 • 썰 📢 과 가끔 일상\n✉️ 문의 • qkrdlstn246@naver.com",
  photo: "profile.jpg",                      // 프로필 사진 파일명 (예: "profile.jpg"). 비우면 이름 첫 글자
};

const LINKS = [
  { emoji: "📊", label: "콘텐츠 매니저", desc: "기획, 업로드, 성과 분석까지 한 곳에서!", url: "https://parkdlstn246-svg.github.io/content-manager/" },
  { emoji: "📝", label: "회고록 모임",   desc: "매주 회고를 올리며 성장하는 모임", url: "https://retro-club-73e7e.web.app/" },
  { emoji: "✍️", label: "네이버 블로그", desc: "기록하고 있어요!", url: "https://m.blog.naver.com/yun_ggaam" },
  { emoji: "🏋️", label: "꾸틴 스팟",     desc: "꾸준히 운동하는 사람들을 소개해요", url: "https://www.instagram.com/kkutine.spot/" },
  // 링크를 더 넣고 싶으면 위 줄을 복사해서 추가하세요
];
/* =========================================== */

const p = document.getElementById("profile");
p.innerHTML = (PROFILE.photo
    ? `<img class="avatar" src="${PROFILE.photo}" alt="${PROFILE.name}">`
    : `<div class="avatar">${PROFILE.name.charAt(0)}</div>`) +
  `<h1>${PROFILE.name}</h1>` +
  (PROFILE.handle ? `<a class="handle" href="${PROFILE.instagram}" target="_blank" rel="noopener">${PROFILE.handle}<span class="go">인스타 바로가기 ↗</span></a>` : "") +
  `<p class="bio">${PROFILE.bio}</p>`;

document.getElementById("links").innerHTML = LINKS.map(l => `
  <li><a class="link" href="${l.url}" target="_blank" rel="noopener">
    <span class="emoji">${l.emoji}</span>
    <span><div class="label">${l.label}</div>${l.desc ? `<div class="desc">${l.desc}</div>` : ""}</span>
    <span class="arrow">→</span>
  </a></li>`).join("");

document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}`;
</script>
</body>
</html>
